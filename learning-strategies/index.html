<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אסטרטגיות למידה - כלי לצוות</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <p class="eyebrow">כלי עבודה לצוות</p>
    <h1>אסטרטגיות למידה בפעולה</h1>
    <p class="lede">שמונה אסטרטגיות הוראה ולמידה מבוססות-מחקר, כל אחת עם ההסבר, איך מיישמים בכיתה, וכלי מעשי שאפשר לקחת ולהשתמש בו כבר מחר.</p>
  </header>

  <nav class="filters" id="filters">
    <button class="filter-chip active" data-filter="all">הכל</button>
    <button class="filter-chip" data-filter="קוגניטיבי">אסטרטגיות קוגניטיביות</button>
    <button class="filter-chip" data-filter="הוראה">פרקטיקות הוראה</button>
    <button class="filter-chip" data-filter="לומד עצמאי">לומד עצמאי</button>
  </nav>

  <main id="cardList" class="card-list"></main>

</div>
<script src="script.js"></script>
</body>
</html>
