<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אני - משחק רגשי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="top-bar">
    <button id="backBtn" class="back-btn hidden">→ חזרה</button>
    <h1 class="logo">אני</h1>
  </header>

  <main>

    <section id="screen-home" class="screen active">
      <p class="subtitle">בואו לגלות איך מרגישים, ומה עוזר כשקשה</p>
      <div class="stage-map">
        <button class="stage-card color-1" data-screen="breathing">
          <span class="medallion">
            <svg viewBox="0 0 40 40" class="icon-leaves">
              <path class="leaf leaf-1" d="M20 30 C11 28 8 20 12 11 C21 13 25 21 20 30 Z"></path>
              <path class="leaf leaf-2" d="M20 30 C29 28 32 20 28 11 C19 13 15 21 20 30 Z"></path>
              <path class="leaf-vein leaf-vein-1" d="M20 30 C16 24 15 17 14 12"></path>
              <path class="leaf-vein leaf-vein-2" d="M20 30 C24 24 25 17 26 12"></path>
            </svg>
          </span>
          <span class="stage-title">תרגילי נשימה</span>
        </button>
        <button class="stage-card color-2" data-screen="jokes">
          <span class="medallion">
            <svg viewBox="0 0 40 40" class="icon-jokes">
              <path class="paper-back" d="M9 12 h24 a3 3 0 0 1 3 3 v9 a3 3 0 0 1 -3 3 h-13 l-7 6 v-6 h-4 a3 3 0 0 1 -3 -3 v-9 a3 3 0 0 1 3 -3 Z"></path>
              <path class="paper-front" d="M7 10 h24 a3 3 0 0 1 3 3 v9 a3 3 0 0 1 -3 3 h-13 l-7 6 v-6 h-4 a3 3 0 0 1 -3 -3 v-9 a3 3 0 0 1 3 -3 Z"></path>
              <rect class="confetti c1" x="12" y="14" width="4" height="6" rx="1.5" transform="rotate(-20 14 17)"></rect>
              <rect class="confetti c2" x="18" y="12" width="4" height="6" rx="1.5" transform="rotate(15 20 15)"></rect>
              <rect class="confetti c3" x="23" y="15" width="4" height="6" rx="1.5" transform="rotate(-10 25 18)"></rect>
            </svg>
          </span>
          <span class="stage-title">בדיחות להפגת חרדה</span>
        </button>
        <button class="stage-card color-3" data-screen="sentences">
          <span class="medallion">
            <svg viewBox="0 0 40 40" class="icon-book">
              <path class="page page-left" d="M20 13 C16 10 10 10 6 12 v17 c4 -2 10 -2 14 1 Z"></path>
              <path class="page page-right" d="M20 13 C24 10 30 10 34 12 v17 c-4 -2 -10 -2 -14 1 Z"></path>
              <path class="spine" d="M20 13 v18"></path>
            </svg>
          </span>
          <span class="stage-title">משפטים שעוזרים</span>
        </button>
        <button class="stage-card color-4" data-screen="personal">
          <span class="medallion">
            <svg viewBox="0 0 40 40" class="icon-heart">
              <path class="heart-back" d="M21 31 C11 24 7 18 10 13 C12 9.5 17 9 21 13.5 C25 9 30 9.5 32 13 C35 18 31 24 21 31 Z"></path>
              <path class="heart-front" d="M20 30 C10 23 6 17 9 12 C11 8.5 16 8 20 12.5 C24 8 29 8.5 31 12 C34 17 30 23 20 30 Z"></path>
              <g class="heart-spark" transform="translate(4,0)">
                <path d="M20,2 C23,6 23,12 20,14 C17,12 17,6 20,2 Z" transform="rotate(0 20 10)"></path>
                <path d="M20,2 C23,6 23,12 20,14 C17,12 17,6 20,2 Z" transform="rotate(130 20 10)"></path>
                <path d="M20,2 C23,6 23,12 20,14 C17,12 17,6 20,2 Z" transform="rotate(250 20 10)"></path>
              </g>
            </svg>
          </span>
          <span class="stage-title">הפינה שלי</span>
        </button>
      </div>
    </section>

    <section id="screen-breathing" class="screen">
      <div id="breathing-select">
        <h2>איזו נשימה בא לך לנסות?</h2>
        <p class="subtitle">שתי הצורות עוזרות להירגע - אפשר לנסות את שתיהן</p>
        <div class="choice-row">
          <button class="choice-card" data-pattern="triangle">
            <span class="medallion">
              <svg viewBox="0 0 40 40" class="icon-origami">
                <path class="fold fold-1" d="M20 20 L20 6 L32 20 Z"></path>
                <path class="fold fold-2" d="M20 20 L32 20 L23 33 Z"></path>
                <path class="fold fold-3" d="M20 20 L23 33 L8 25 Z"></path>
                <path class="fold-crease" d="M20 6 L20 20 L32 20 M20 20 L23 33 M20 20 L8 25"></path>
              </svg>
            </span>
            <span class="choice-title">נשימת משולש</span>
          </button>
          <button class="choice-card" data-pattern="rectangle">
            <span class="medallion">
              <svg viewBox="0 0 40 40" class="icon-pinwheel-mini">
                <path class="blade blade-1" d="M20 20 L20 6 C25 7 27 12 24 17 Z"></path>
                <path class="blade blade-2" d="M20 20 L34 20 C33 25 28 27 23 24 Z"></path>
                <path class="blade blade-3" d="M20 20 L20 34 C15 33 13 28 16 23 Z"></path>
                <path class="blade blade-4" d="M20 20 L6 20 C7 15 12 13 17 16 Z"></path>
                <circle class="pin" cx="20" cy="20" r="2.4"></circle>
              </svg>
            </span>
            <span class="choice-title">נשימת מלבן</span>
          </button>
        </div>
      </div>

      <div id="breathing-play" class="hidden">
        <div class="char-wrap">
          <svg id="breathChar" viewBox="0 0 200 200" class="phase-inhale">
            <ellipse id="groundShadow" cx="100" cy="197" rx="50" ry="6"></ellipse>

            <path class="arm-rest" d="M70,112 Q54,124 58,142" fill="none"></path>
            <g id="torsoGroup">
              <ellipse id="charBody" cx="100" cy="124" rx="50" ry="38"></ellipse>
              <path id="apronBib" d="M84,96 h32 v20 q-16,8 -32,0 Z"></path>
              <g class="bibDots">
                <circle cx="92" cy="104" r="1.6"></circle>
                <circle cx="106" cy="102" r="1.6"></circle>
                <circle cx="88" cy="114" r="1.6"></circle>
                <circle cx="102" cy="115" r="1.6"></circle>
                <circle cx="112" cy="110" r="1.6"></circle>
              </g>
            </g>

            <ellipse id="potRim" cx="100" cy="160" rx="46" ry="12"></ellipse>
            <path id="potBody" d="M54,160 Q54,190 100,190 Q146,190 146,160 Z"></path>
            <ellipse id="porridge" cx="100" cy="158" rx="39" ry="8"></ellipse>

            <g class="steamWisps">
              <g class="wisp-pos" transform="translate(85,150)"><path class="wisp" d="M-4,0 Q1,-15 -4,-30 Q-9,-45 -4,-60" fill="none"></path></g>
              <g class="wisp-pos" transform="translate(100,146)"><path class="wisp" d="M-4,0 Q1,-15 -4,-30 Q-9,-45 -4,-60" fill="none"></path></g>
              <g class="wisp-pos" transform="translate(115,150)"><path class="wisp" d="M-4,0 Q1,-15 -4,-30 Q-9,-45 -4,-60" fill="none"></path></g>
            </g>

            <g class="flame">
              <path class="flame-shape" d="M90,200 q4,-12 10,-12 q6,0 10,12 q-10,5 -20,0 Z"></path>
              <path class="flame-shape flame-shape-2" d="M108,200 q3,-9 8,-9 q5,0 8,9 q-8,4 -16,0 Z"></path>
            </g>

            <g class="arm-spoon">
              <path class="arm-spoon-path" d="M128,104 Q118,132 102,160" fill="none"></path>
              <ellipse class="spoon-bowl" cx="100" cy="162" rx="8" ry="5"></ellipse>
            </g>

            <circle id="charHead" cx="100" cy="62" r="30"></circle>
            <circle class="cheek cheek-left" cx="78" cy="72"></circle>
            <circle class="cheek cheek-right" cx="122" cy="72"></circle>
            <path id="headscarf" d="M60,88 C40,-10 160,-10 140,88 Q125,50 100,42 Q75,50 60,88 Z"></path>
            <g class="scarfTrim">
              <circle cx="80" cy="49"></circle>
              <circle cx="100" cy="44"></circle>
              <circle cx="120" cy="49"></circle>
            </g>

            <g class="eyebrows">
              <path class="eyebrow eyebrow-left" d="M76,50 Q84,51 92,54" fill="none"></path>
              <path class="eyebrow eyebrow-right" d="M108,54 Q116,51 124,50" fill="none"></path>
            </g>
            <g class="eye eye-left">
              <circle cx="88" cy="58" r="6" class="eye-white"></circle>
              <circle cx="88" cy="58" r="3" class="pupil"></circle>
              <ellipse class="eyelid" cx="88" cy="53.5" rx="7" ry="2.8"></ellipse>
            </g>
            <g class="eye eye-right">
              <circle cx="112" cy="58" r="6" class="eye-white"></circle>
              <circle cx="112" cy="58" r="3" class="pupil"></circle>
              <ellipse class="eyelid" cx="112" cy="53.5" rx="7" ry="2.8"></ellipse>
            </g>
            <path class="eye-closed eye-closed-left" d="M80,58 q8,-7 16,0" fill="none"></path>
            <path class="eye-closed eye-closed-right" d="M104,58 q8,-7 16,0" fill="none"></path>
            <path id="nose" d="M97,64 Q100,71 104,64" fill="none"></path>
            <path class="mouth mouth-inhale" d="M87,75 Q100,81 113,75" fill="none"></path>
            <path class="mouth mouth-hold" d="M89,75 Q100,82 111,75" fill="none"></path>
            <ellipse class="mouth mouth-exhale" cx="100" cy="78"></ellipse>

            <g class="breathLines">
              <g class="bl-pos" transform="translate(88,70) rotate(-14)"><path class="breath-line" d="M0,0 Q8,-3 16,0" fill="none"></path></g>
              <g class="bl-pos" transform="translate(91,78) rotate(-2)"><path class="breath-line" d="M0,0 Q8,-3 16,0" fill="none"></path></g>
              <g class="bl-pos" transform="translate(88,86) rotate(10)"><path class="breath-line" d="M0,0 Q8,-3 16,0" fill="none"></path></g>
            </g>
          </svg>
        </div>
        <svg id="pinwheel" class="guide-svg phase-inhale" viewBox="0 0 100 100">
          <ellipse class="pinwheel-shadow" cx="50" cy="90" rx="26" ry="5"></ellipse>
          <rect class="pinwheel-stick" x="47" y="52" width="6" height="38" rx="3"></rect>
          <g class="pinwheel-blades">
            <path class="blade blade-1" d="M50,50 L50,10 C60,13 65,22 62,32 Z"></path>
            <path class="blade blade-2" d="M50,50 L90,50 C87,60 78,65 68,62 Z"></path>
            <path class="blade blade-3" d="M50,50 L50,90 C40,87 35,78 38,68 Z"></path>
            <path class="blade blade-4" d="M50,50 L10,50 C13,40 22,35 32,38 Z"></path>
          </g>
          <circle class="pinwheel-pin" cx="50" cy="50" r="5"></circle>
          <circle class="pinwheel-pin-hi" cx="48.6" cy="48.6" r="1.5"></circle>
        </svg>
        <div id="breathLabel">שאפו אוויר</div>
        <div id="breathCaption"></div>
        <div id="breathCount">4</div>
        <button id="breathStop" class="secondary-btn">סיימתי, חזרה לבחירה</button>
      </div>
    </section>

    <section id="screen-jokes" class="screen">
      <h2>קצת צחוק תמיד עוזר</h2>
      <div class="card-box" id="jokeBox"></div>
      <button id="nextJoke" class="primary-btn">בדיחה הבאה</button>
    </section>

    <section id="screen-sentences" class="screen">
      <h2>משפטים שכדאי לזכור</h2>
      <div class="card-box" id="sentenceBox"></div>
      <button id="nextSentence" class="primary-btn">משפט נוסף</button>
    </section>

    <section id="screen-personal" class="screen">
      <h2>הפינה שלי</h2>
      <p class="subtitle">איך אני מרגיש/ה עכשיו?</p>
      <div class="mood-row" id="moodRow"></div>
      <textarea id="personalText" placeholder="אפשר לכתוב כאן כל מה שבא לך... זה נשאר רק אצלך, על המכשיר שלך"></textarea>
      <button id="saveEntry" class="primary-btn">שמירה</button>
      <div id="entriesList"></div>
    </section>

  </main>
</div>
<script src="script.js"></script>
</body>
</html>
