<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אני - משחק רגשי</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="top-bar">
    <button id="backBtn" class="back-btn hidden">→ חזרה</button>
    <h1 class="logo">אני <span>💛</span></h1>
  </header>

  <main>

    <section id="screen-home" class="screen active">
      <p class="subtitle">בואו לגלות איך מרגישים, ומה עוזר כשקשה</p>
      <div class="stage-map">
        <button class="stage-card color-1" data-screen="breathing">
          <span class="stage-icon">🌬️</span>
          <span class="stage-title">תרגילי נשימה</span>
        </button>
        <button class="stage-card color-2" data-screen="jokes">
          <span class="stage-icon">😄</span>
          <span class="stage-title">בדיחות להפגת חרדה</span>
        </button>
        <button class="stage-card color-3" data-screen="sentences">
          <span class="stage-icon">💬</span>
          <span class="stage-title">משפטים שעוזרים</span>
        </button>
        <button class="stage-card color-4" data-screen="personal">
          <span class="stage-icon">📓</span>
          <span class="stage-title">הפינה שלי</span>
        </button>
      </div>
    </section>

    <section id="screen-breathing" class="screen">
      <div id="breathing-select">
        <h2>איזו נשימה בא לך לנסות?</h2>
        <p class="subtitle">שתי הצורות עוזרות להירגע - אפשר לנסות את שתיהן</p>
        <div class="choice-row">
          <button class="choice-card" data-pattern="triangle">
            <span class="stage-icon">🔺</span>
            <span>נשימת משולש</span>
          </button>
          <button class="choice-card" data-pattern="rectangle">
            <span class="stage-icon">🟦</span>
            <span>נשימת מלבן</span>
          </button>
        </div>
      </div>

      <div id="breathing-play" class="hidden">
        <div class="char-wrap">
          <svg id="breathChar" viewBox="0 0 200 200" class="phase-inhale">
            <g class="flame">
              <path class="flame-shape" d="M90,206 q4,-14 10,-14 q6,0 10,14 q-10,6 -20,0 Z"></path>
              <path class="flame-shape flame-shape-2" d="M108,208 q3,-10 8,-10 q5,0 8,10 q-8,5 -16,0 Z"></path>
            </g>
            <path id="potBody" d="M54,172 Q54,198 100,198 Q146,198 146,172 Z"></path>
            <ellipse id="porridge" cx="100" cy="170" rx="39" ry="9"></ellipse>
            <ellipse id="potRim" cx="100" cy="172" rx="46" ry="13"></ellipse>
            <path class="arm-rest" d="M70,120 Q54,132 58,150" fill="none"></path>
            <g id="torsoGroup">
              <ellipse id="charBody" cx="100" cy="132" rx="52" ry="44"></ellipse>
              <path id="apronBib" d="M84,100 h32 v22 q-16,8 -32,0 Z"></path>
            </g>
            <g class="arm-spoon">
              <path class="arm-spoon-path" d="M130,112 Q120,140 104,168" fill="none"></path>
              <ellipse class="spoon-bowl" cx="100" cy="170" rx="8" ry="5"></ellipse>
            </g>
            <circle id="charHead" cx="100" cy="76" r="33"></circle>
            <circle class="cheek cheek-left" cx="78" cy="86"></circle>
            <circle class="cheek cheek-right" cx="122" cy="86"></circle>
            <g class="glasses">
              <circle cx="88" cy="74" r="10"></circle>
              <circle cx="112" cy="74" r="10"></circle>
              <path d="M98,74 h4"></path>
            </g>
            <g class="eye eye-left">
              <circle cx="88" cy="74" r="6" class="eye-white"></circle>
              <circle cx="88" cy="74" r="3" class="pupil"></circle>
            </g>
            <g class="eye eye-right">
              <circle cx="112" cy="74" r="6" class="eye-white"></circle>
              <circle cx="112" cy="74" r="3" class="pupil"></circle>
            </g>
            <path class="eye-closed eye-closed-left" d="M80,74 q8,-7 16,0" fill="none"></path>
            <path class="eye-closed eye-closed-right" d="M104,74 q8,-7 16,0" fill="none"></path>
            <ellipse class="mouth mouth-inhale" cx="100" cy="90"></ellipse>
            <path class="mouth mouth-hold" d="M92,90 h16" fill="none"></path>
            <ellipse class="mouth mouth-exhale" cx="100" cy="92"></ellipse>
            <path id="headscarf" d="M64,68 Q100,32 136,68 Q124,54 100,50 Q76,54 64,68 Z"></path>
            <path id="scarfKnot" d="M128,58 q18,4 14,26 q-10,-4 -14,-26 Z"></path>
          </svg>
          <div id="charParticles" class="particles"></div>
        </div>
        <svg id="breathSvg" class="guide-svg" viewBox="0 0 200 200">
          <polygon id="breathShape" class="breath-shape" points=""></polygon>
          <circle id="breathDot" class="breath-dot" r="7"></circle>
        </svg>
        <div id="breathLabel">שאפו אוויר</div>
        <div id="breathCaption"></div>
        <div id="breathCount">4</div>
        <button id="breathStop" class="secondary-btn">סיימתי, חזרה לבחירה</button>
      </div>
    </section>

    <section id="screen-jokes" class="screen">
      <h2>קצת צחוק תמיד עוזר 😄</h2>
      <div class="card-box" id="jokeBox"></div>
      <button id="nextJoke" class="primary-btn">בדיחה הבאה</button>
    </section>

    <section id="screen-sentences" class="screen">
      <h2>משפטים שכדאי לזכור</h2>
      <div class="card-box" id="sentenceBox"></div>
      <button id="nextSentence" class="primary-btn">משפט נוסף</button>
    </section>

    <section id="screen-personal" class="screen">
      <h2>הפינה שלי</h2>
      <p class="subtitle">איך אני מרגיש/ה עכשיו?</p>
      <div class="mood-row" id="moodRow"></div>
      <textarea id="personalText" placeholder="אפשר לכתוב כאן כל מה שבא לך... זה נשאר רק אצלך, על המכשיר שלך"></textarea>
      <button id="saveEntry" class="primary-btn">שמירה</button>
      <div id="entriesList"></div>
    </section>

  </main>
</div>
<script src="script.js"></script>
</body>
</html>
